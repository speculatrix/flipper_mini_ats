; UART <-> TCP bridge for the Flipper Zero Wi-Fi devboard (ESP32-S2-WROVER).
; Connects to an ATS-Mini receiver's ad hoc TCP remote port (60000) and
; forwards bytes to/from the Flipper over the GPIO header UART.

[env:flipper_wifi_devboard]
platform = espressif32
board = esp32-s2-saola-1
framework = arduino
monitor_speed = 115200
build_flags =
    ; Keep Serial on UART0 (GPIO43 TX / GPIO44 RX), which is wired to the
    ; Flipper's GPIO header pins 14 (RX) / 13 (TX).
    -DARDUINO_USB_CDC_ON_BOOT=0
